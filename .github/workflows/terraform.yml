
name: Terraform CI and Lambda Packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aurora-lambda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt 

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Generate Terraform dependency graph
        run: terraform graph -type=plan > terraform-graph.dot

      - name: Display Terraform files
        run: find . -name "*.tf" -not -path "./.terraform/*"

  package-lambda:
    name: Build Lambda deployment package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create package directory
        run: mkdir -p aurora-lambda/lambda/package

      - name: Install Python dependencies
        run: |
          python -m pip install \
            -r aurora-lambda/lambda/src/requirements.txt \
            -t aurora-lambda/lambda/package

      - name: Copy Lambda handler
        run: |
          cp aurora-lambda/lambda/src/handler.py \
             aurora-lambda/lambda/package/handler.py

      - name: Create Lambda ZIP
        working-directory: aurora-lambda/lambda/package
        run: zip -r ../function.zip .

      - name: Verify Lambda ZIP
        run: |
          unzip -l aurora-lambda/lambda/function.zip
          test -f aurora-lambda/lambda/function.zip

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: employee-aurora-lambda-package
          path: aurora-lambda/lambda/function.zip
          retention-days: 7
